<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bradford Holding AS</title>
  <meta name="description" content="Bradford Holding AS — Jakob Bradford">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0c10;
      --surface:  #13131a;
      --border:   rgba(255,255,255,0.07);
      --gold:     #c8a96e;
      --gold-dim: rgba(200,169,110,0.15);
      --text:     #ede9e2;
      --muted:    #6b6b7e;
      --hover:    #1a1a24;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
    }

    .logo-mark {
      width: 48px;
      height: 2px;
      background: var(--gold);
      margin: 0 auto 40px;
      opacity: 0.7;
    }

    .company-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: clamp(32px, 6vw, 56px);
      letter-spacing: 0.08em;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .company-name span {
      color: var(--gold);
      font-weight: 400;
    }

    .tagline {
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 400;
    }

    /* ── DIVIDER ── */
    .divider {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      height: 1px;
      background: var(--border);
    }

    /* ── PORTFOLIO ── */
    .portfolio {
      padding: 80px 24px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }

    .section-label {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 40px;
      text-align: center;
    }

    .companies {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .company-card {
      display: block;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px 28px;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      position: relative;
      overflow: hidden;
    }

    .company-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }

    .company-card:hover {
      background: var(--hover);
      border-color: rgba(200,169,110,0.2);
      transform: translateY(-2px);
    }

    .company-card:hover::after {
      transform: scaleX(1);
    }

    .card-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .card-url {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .card-arrow {
      position: absolute;
      top: 28px;
      right: 24px;
      color: var(--gold);
      opacity: 0;
      font-size: 16px;
      transition: opacity 0.2s, transform 0.2s;
    }

    .company-card:hover .card-arrow {
      opacity: 1;
      transform: translate(2px, -2px);
    }

    /* ── CONTACT ── */
    .contact {
      border-top: 1px solid var(--border);
      padding: 60px 24px 80px;
      text-align: center;
    }

    .contact .section-label { margin-bottom: 32px; }

    .contact-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 24px;
      letter-spacing: 0.04em;
    }

    .contact-links {
      display: flex;
      gap: 32px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.02em;
      transition: color 0.2s;
      padding: 4px 0;
      border-bottom: 1px solid transparent;
    }

    .contact-link:hover {
      color: var(--gold);
      border-bottom-color: var(--gold-dim);
    }

    .contact-icon {
      width: 16px;
      height: 16px;
      opacity: 0.6;
      flex-shrink: 0;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* ── FADE IN ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    header, .portfolio, .contact {
      animation: fadeUp 0.7s ease both;
    }
    .portfolio { animation-delay: 0.15s; }
    .contact   { animation-delay: 0.25s; }

    /* ── MOBILE ── */
    @media (max-width: 500px) {
      header { padding: 80px 24px 60px; }
      .companies { grid-template-columns: 1fr; }
      .contact-links { flex-direction: column; align-items: center; gap: 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-mark"></div>
    <h1 class="company-name">Bradford<span> Holding</span> AS</h1>
  </header>

  <div class="divider"></div>

  <section class="portfolio">
    <p class="section-label">Projects</p>
    <div class="companies">

      <a class="company-card" href="https://ndcconferences.com" target="_blank" rel="noopener">
        <div class="card-name">NDC Conferences</div>
        <div class="card-url">ndcconferences.com</div>
        <span class="card-arrow">↗</span>
      </a>

      <a class="company-card" href="https://azuredevsummit.com" target="_blank" rel="noopener">
        <div class="card-name">Azure Dev Summit</div>

      </a>

      <a class="company-card" href="https://10mevents.com" target="_blank" rel="noopener">

      </a>

    </div>
  </section>

  <section class="contact">
    <p class="section-label">Contact</p>
    <p class="contact-name">Jakob Bradford</p>
    <div class="contact-links">

      <a class="contact-link" href="mailto:jakob@bradford.no">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <polyline points="2,4 12,13 22,4"/>
        </svg>
        jakob@bradford.no
      </a>

      <a class="contact-link" href="tel:+4745272229">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
        </svg>
        +47 452 72 229

    </div>
  </section>

  <footer>
    &copy; 2026 Bradford Holding AS · Orgnummer: 998 530 946
  </footer>

</body>
</html>
